      - "A los veinticuatro años, Aldric fue reclutado por la Orden del Crepúsculo durante la batalla de los Pasos Rojos. Allí demostró su valía al defender el flanco izquierdo durante tres días sin refuerzos."
      - "La Orden del Crepúsculo es una organización de élite al servicio de la Corona de Valdorath. Sus miembros juran proteger las fronteras del reino y eliminar amenazas sobrenaturales."
    query: "Describe la historia del guerrero Aldric, su entrenamiento y sus batallas más importantes."
