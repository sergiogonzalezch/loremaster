    simulated_context:
      - "Eiren Valdmoor es el hijo menor del Duque de Valdmoor, criado en la corte del Rey Serath. Desde niño sufrió el desdén de los nobles de alta alcurnia que lo consideraban indigno de su título."
      - "Los archivos de la corte registran varias peticiones de Eiren solicitando ser trasladado a la frontera norte, lejos de la capital. Todas fueron denegadas por el rey sin explicación."
      - "Un antiguo servidor de palacio testificó que Eiren soportó años de trato vejatorio por parte de los consejeros más cercanos al trono, que lo usaban como blanco de burlas en los banquetes."
    query: "El personaje sufría el acoso de la corte real durante años — describe cómo lo afectó psicológicamente."
