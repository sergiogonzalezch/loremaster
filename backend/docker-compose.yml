services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    # Solo expuerto para desarrollo local. Producción: eliminar ports y usar red interna.
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - loremaster

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loremaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loremaster}
      POSTGRES_DB: ${POSTGRES_DB:-loremaster}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loremaster
    # Bind to 127.0.0.1 only in production (remove ports or use 127.0.0.1:5433:5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loremaster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - loremaster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  postgres_data:

networks:
  loremaster:
    driver: bridge
