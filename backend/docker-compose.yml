# Infraestructura base — desarrollo local (SQLite mode).
# Incluye solo Qdrant y Redis. Para añadir Postgres usar docker-compose.postgres.yml.
#
# Uso desde la raíz del proyecto (ver Makefile raíz):
#   make infra       → solo este archivo (SQLite)
#   make infra-pg    → este + docker-compose.postgres.yml (PostgreSQL)
#   make dev         → infra + backend + frontend (SQLite)
#   make dev-pg      → infra + backend + frontend (PostgreSQL)

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - loremaster

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - loremaster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:

networks:
  loremaster:
    driver: bridge
