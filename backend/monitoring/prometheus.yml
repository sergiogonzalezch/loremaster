global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: loremaster
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics
    # Token configurado en METRICS_TOKEN del backend.
    # En producción: rotar y actualizar aquí o usar bearer_token_file.
    bearer_token: "dev-metrics-token"
