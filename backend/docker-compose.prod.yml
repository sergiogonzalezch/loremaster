# Infraestructura de producción/demo.
# Incluye Qdrant + Redis + Postgres (siempre activos en prod).
# Ningún servicio expone puertos al host; solo accesibles dentro de la red interna.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables requeridas (inyectar via secrets manager o CI/CD, no .env en disco):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - loremaster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loremaster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      # Ollama y ComfyUI corren en el host — accesibles via host-gateway en Linux.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      COMFYUI_URL: http://host.docker.internal:8188
      MEDIA_ROOT: /app/media
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:?STORAGE_BASE_URL requerida}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerida}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS requerida}
    volumes:
      - media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - loremaster

volumes:
  qdrant_data:
  postgres_data:
  media_data:

networks:
  loremaster:
    driver: bridge
