# Infraestructura de producción/demo.
# Incluye Qdrant + Redis + Postgres (siempre activos en prod).
# Ningún servicio expone puertos al host; solo accesibles dentro de la red interna.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables requeridas (inyectar via secrets manager o CI/CD, no .env en disco):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  floci:
    image: floci/floci:latest
    container_name: loremaster-floci
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loremaster

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - loremaster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loremaster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      floci:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      # Ollama y ComfyUI corren en el host — accesibles via host-gateway en Linux.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      COMFYUI_URL: http://host.docker.internal:8188
      # Llama Guard — segunda capa semántica de moderación (fail-open).
      # Activar en demo/producción. Requiere: ollama pull llama-guard3:8b (~4.9 GB).
      LLAMA_GUARD_ENABLED: ${LLAMA_GUARD_ENABLED:-false}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:8b}
      LLAMA_GUARD_TIMEOUT: ${LLAMA_GUARD_TIMEOUT:-5.0}
      MEDIA_ROOT: /app/media
      # Storage — S3 via Floci (emulador AWS local, DNS interno Docker).
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://floci:4566
      S3_BUCKET: ${S3_BUCKET:-loremaster-media}
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:4566/loremaster-media}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerida}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS requerida}
    volumes:
      - media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - loremaster

volumes:
  qdrant_data:
  postgres_data:
  media_data:
  floci_data:

networks:
  loremaster:
    driver: bridge