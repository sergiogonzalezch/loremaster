# Infraestructura de producción/demo.
# Incluye Qdrant + Redis + Postgres + Floci + backend API + frontend Nginx.
# Un único puerto expuesto al host: 80 (Nginx).
# Nginx actúa como reverse proxy: /api/ → backend, /media/ → Floci (interno).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Variables requeridas (inyectar via secrets manager o CI/CD, no .env en disco):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY, ALLOWED_ORIGINS

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  floci:
    image: floci/floci:latest
    container_name: loremaster-floci
    restart: unless-stopped
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: us-east-1
    # Sin ports: Floci solo accesible dentro de la red Docker.
    # Nginx proxea /media/ → floci:4566 internamente.
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loremaster

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - loremaster
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loremaster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loremaster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      floci:
        condition: service_healthy
    # Sin ports: el backend solo es accesible via Nginx (red interna Docker).
    environment:
      ENVIRONMENT: demo
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      # Ollama y ComfyUI corren en el host — accesibles via host-gateway en Linux.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:latest
      OLLAMA_EXCLUDED_MODELS: '["qwen3.5"]'
      # Image generation
      IMAGE_BACKEND: ${IMAGE_BACKEND:-comfyui}
      IMAGE_PROMPT_MODEL: mistral:latest
      COMFYUI_URL: http://host.docker.internal:8188
      # Embeddings — debe coincidir con el modelo pre-descargado en el Dockerfile.
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      # Llama Guard — segunda capa semántica de moderación (fail-open).
      # Activar en demo/producción. Requiere: ollama pull llama-guard3:8b (~4.9 GB).
      LLAMA_GUARD_ENABLED: ${LLAMA_GUARD_ENABLED:-false}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL:-llama-guard3:8b}
      LLAMA_GUARD_TIMEOUT: ${LLAMA_GUARD_TIMEOUT:-5.0}
      MEDIA_ROOT: /app/media
      # Storage — fallback = Floci (demo local). Para R2/S3 real: definir vars en .env.production.
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://floci:4566}
      S3_BUCKET: ${S3_BUCKET:-loremaster-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      # Nginx proxea /media/ → floci:4566/loremaster-media/ (bucket absorbido en proxy_pass).
      # Las image_url generadas quedan como <dominio>/media/<path>, mismo origen que el frontend.
      # Defecto: http://localhost/media para demo local. Sobreescribir en .env para otros dominios.
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost/media}
      # Rate limiting — false por defecto (demo local). Activar en .env.production
      # cuando haya usuarios reales: RATE_LIMIT_ENABLED=true
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      # RATE_LIMIT_PER_MINUTE: "30"
      # RATE_LIMIT_LLM_PER_MINUTE: "5"
      # RATE_LIMIT_IMAGE_PER_MINUTE: "3"
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerida}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS requerida}
    volumes:
      - media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - loremaster

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_MEDIA_HOST: ${VITE_MEDIA_HOST}
    container_name: loremaster-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    networks:
      - loremaster

volumes:
  qdrant_data:
    external: true
    name: backend_qdrant_data
  postgres_data:
    external: true
    name: backend_postgres_data
  media_data:
    external: true
    name: backend_media_data
  floci_data:
    external: true
    name: backend_floci_data

networks:
  loremaster:
    driver: bridge