server {
    listen 80;

    # ── Frontend (SPA) ────────────────────────────────────────────────────────
    # Sirve los archivos estáticos del build. Cualquier ruta desconocida
    # devuelve index.html para que React Router maneje el enrutamiento cliente.
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    # Proxea /api/ al contenedor del backend dentro de la red Docker.
    # El frontend usa VITE_API_BASE_URL=/api/v1 (relativo), así que todas las
    # llamadas a fetch('/api/v1/...') llegan aquí y se reenvían al backend.
    location /api/ {
        proxy_pass         http://loremaster-api:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para endpoints LLM que pueden tardar.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Imágenes S3/Floci ─────────────────────────────────────────────────────
    # Proxea /media/ al bucket de Floci dentro de la red Docker.
    # El bucket (loremaster-media) se absorbe en el proxy_pass para que
    # las URLs públicas sean /media/<path> en lugar de /media/loremaster-media/<path>.
    # STORAGE_BASE_URL en el backend apunta a http://loremaster-frontend/media
    # para que los image_url generados sean rutas relativas a este servidor.
    location /media/ {
        proxy_pass       http://loremaster-floci:4566/loremaster-media/;
        proxy_set_header Host loremaster-floci;
    }
}